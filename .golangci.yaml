version: '2'
linters:
  default: all
  disable:
    - exhaustruct_v5
    - nlreturn
    - noinlineerr
    - paralleltest
    - wsl_v5
    # retired
    - exhaustruct
    - gomodguard
    - wsl
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - goconst
          - exhaustruct
          - funlen
          - lll
          - varnamelen
        path: (.+)_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
  settings:
    cyclop:
      max-complexity: 15
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - 'golang.org/x/text'
            - 'github.com/nalgeon/be'
            - 'github.com/bengarrett/bbs'
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
