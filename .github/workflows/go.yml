name: Go

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Build
        run: go build -v -trimpath ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v -race -count=1 ./...
      - name: Nilaway
        run: go tool nilaway -test=false ./...
