name: GoReleaser
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.1.0)'
        required: false
        default: ''
      force_update:
        description: 'Force update even if formula is already up-to-date'
        required: false
        default: 'false'
permissions:
  contents: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update_formula:
    runs-on: ubuntu-latest
    needs: goreleaser
    if: always() && (needs.goreleaser.result == 'success' || needs.goreleaser.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main
      - name: Update Homebrew formula
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          FORCE_UPDATE: ${{ github.event.inputs.force_update }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_VERSION}" ]; then
              VERSION="${INPUT_VERSION#v}"
            else
              LATEST_TAG=$(git tag -l "v*" | sort -V | tail -1)
              LATEST_TAG=${LATEST_TAG:-v0.0.0}
              VERSION=${LATEST_TAG#v}
            fi
          else
            VERSION=${REF_NAME#v}
          fi

          TAR_URL="https://github.com/bengarrett/bbs/archive/refs/tags/v${VERSION}.tar.gz"
          SHA=$(curl -fsSL --retry 5 --retry-delay 2 "${TAR_URL}" | sha256sum | awk '{print $1}')

          sed -i "s|^  url \".*\"$|  url \"${TAR_URL}\"|" Formula/bbs.rb
          sed -i "s|^  sha256 \".*\"$|  sha256 \"${SHA}\"|" Formula/bbs.rb
          sed -i "s|^  version \".*\"$|  version \"${VERSION}\"|" Formula/bbs.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/bbs.rb
          if [ "${FORCE_UPDATE}" = "true" ]; then
            echo "Force update enabled - proceeding with commit"
          elif git diff --cached --quiet; then
            echo "Formula already up-to-date"
            exit 0
          fi
          git commit -m "ci: bump Homebrew formula to v${VERSION}"
          git push origin main
